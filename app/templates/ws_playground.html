<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-blue: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --accent-purple: #a371f7;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 .icon {
            font-size: 28px;
        }

        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Layout */
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        /* Card */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-tertiary);
        }

        .card-header h2 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .card-body {
            padding: 20px;
        }

        /* Connection Section */
        .connection-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input[type="text"], textarea, select {
            font-family: var(--font-mono);
            font-size: 13px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        input[type="text"] {
            flex: 1;
        }

        select {
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-green);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #2ea043;
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            background: #da3633;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border-color);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* Status */
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: 8px;
            background: var(--bg-primary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-disconnected .status-dot {
            background: var(--accent-red);
        }

        .status-connecting .status-dot {
            background: var(--accent-orange);
        }

        .status-connected .status-dot {
            background: var(--accent-green);
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Messages Log */
        .messages-container {
            height: 400px;
            overflow-y: auto;
            background: var(--bg-primary);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .message-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-item:last-child {
            border-bottom: none;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .message-direction {
            font-size: 14px;
        }

        .message-direction.incoming {
            color: var(--accent-green);
        }

        .message-direction.outgoing {
            color: var(--accent-blue);
        }

        .message-time {
            color: var(--text-secondary);
        }

        .message-type {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .message-type.client {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
        }

        .message-type.server {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }

        .message-type.error {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }

        .message-body {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Copy Button */
        .copy-btn {
            font-size: 12px;
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <header class="header">
        <h1>
            <span class="icon">🔌</span>
            {{ title }}
        </h1>
        <span class="badge">WebSocket API</span>
    </header>

    <div class="layout">
        <!-- Left Column -->
        <div class="left-column">
            <!-- Connection -->
            <div class="card" style="margin-bottom: 24px;">
                <div class="card-header">
                    <h2>🔗 Connection</h2>
                    <div class="status status-disconnected" id="connection-status">
                        <span class="status-dot"></span>
                        <span class="status-text">Disconnected</span>
                    </div>
                </div>
                <div class="card-body">
                    <div class="connection-form">
                        <div class="input-group">
                            <label for="ws-url">WebSocket URL</label>
                            <input id="ws-url" readonly type="text" value="{{ ws_url }}">
                        </div>
                        <div class="input-group">
                            <label for="jwt-token">JWT Token (Sec-WebSocket-Protocol, optional for dev mode)</label>
                            <div class="input-row">
                                <input id="jwt-token"
                                       placeholder="Enter JWT token (sent via Sec-WebSocket-Protocol header)"
                                       type="text">
                            </div>
                            <small style="color: var(--text-secondary); font-size: 12px;">
                                🔐 토큰은 <code>Sec-WebSocket-Protocol</code> 헤더로 전달됩니다 (보안)
                            </small>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-primary" id="connect-btn">
                                <span>⚡</span> Connect
                            </button>
                            <button class="btn btn-danger" disabled id="disconnect-btn">
                                <span>✕</span> Disconnect
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ping -->
            <div class="card">
                <div class="card-header">
                    <h2>📤 Ping</h2>
                </div>
                <div class="card-body">
                    <small style="color: var(--text-secondary); font-size: 12px;">
                        수신 전용 소켓입니다. 클라이언트가 보내는 메시지는 <code>ping</code>뿐이고 서버는 <code>pong</code>으로 답합니다.
                        타이머 명령을 REST(<code>/v1/timers</code>)로 보내면 이벤트가 여기에 표시됩니다.
                    </small>
                    <div class="btn-group" style="margin-top: 16px;">
                        <button class="btn btn-primary" disabled id="send-btn">
                            <span>📨</span> Send ping
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-column">
            <!-- Messages -->
            <div class="card">
                <div class="card-header">
                    <h2>💬 Messages</h2>
                    <button class="copy-btn" id="clear-btn">Clear</button>
                </div>
                <div class="card-body" style="padding: 0;">
                    <div class="messages-container" id="messages">
                        <div class="empty-state">
                            <div class="icon">📭</div>
                            <div>No messages yet</div>
                            <div style="font-size: 13px; margin-top: 8px;">Connect to start receiving messages</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // WebSocket connection
    let ws = null;
    let messageHistory = [];

    // DOM elements
    const wsUrlInput = document.getElementById('ws-url');
    const jwtTokenInput = document.getElementById('jwt-token');
    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const messagesContainer = document.getElementById('messages');
    const connectionStatus = document.getElementById('connection-status');

    // Clear messages
    clearBtn.addEventListener('click', () => {
        messageHistory = [];
        messagesContainer.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div>No messages yet</div>
                    <div style="font-size: 13px; margin-top: 8px;">Connect to start receiving messages</div>
                </div>
            `;
    });

    // Connection status update
    function updateStatus(status, text) {
        connectionStatus.className = `status status-${status}`;
        connectionStatus.querySelector('.status-text').textContent = text;
    }

    // Add message to log
    function addMessage(direction, data, type = null) {
        // Remove empty state
        const emptyState = messagesContainer.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const now = new Date().toLocaleTimeString('ko-KR', {hour12: false});
        let msgType = type;

        if (!msgType && typeof data === 'object') {
            msgType = data.type || 'unknown';
        }

        const messageItem = document.createElement('div');
        messageItem.className = 'message-item';

        const dirClass = direction === 'incoming' ? 'incoming' : 'outgoing';
        const dirIcon = direction === 'incoming' ? '←' : '→';
        const typeClass = direction === 'incoming' ? 'server' : 'client';

        if (type === 'error') {
            messageItem.innerHTML = `
                    <div class="message-header">
                        <span class="message-direction ${dirClass}">${dirIcon}</span>
                        <span class="message-time">${now}</span>
                        <span class="message-type error">error</span>
                    </div>
                    <div class="message-body">${data}</div>
                `;
        } else {
            const bodyContent = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
            messageItem.innerHTML = `
                    <div class="message-header">
                        <span class="message-direction ${dirClass}">${dirIcon}</span>
                        <span class="message-time">${now}</span>
                        <span class="message-type ${typeClass}">${msgType}</span>
                    </div>
                    <div class="message-body">${bodyContent}</div>
                `;
        }

        messagesContainer.insertBefore(messageItem, messagesContainer.firstChild);
        messageHistory.unshift({direction, data, time: now});
    }

    // Connect
    connectBtn.addEventListener('click', () => {
        const baseUrl = window.location.origin.replace(/^http/, 'ws');
        const wsPath = wsUrlInput.value;
        const token = jwtTokenInput.value.trim();
        const wsUrl = `${baseUrl}${wsPath}`;

        updateStatus('connecting', 'Connecting...');
        connectBtn.disabled = true;

        // 토큰은 Sec-WebSocket-Protocol 헤더로 전달 (보안)
        const protocols = token ? [`authorization.bearer.${token}`] : [];
        ws = new WebSocket(wsUrl, protocols);

        ws.onopen = () => {
            updateStatus('connected', 'Connected');
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            sendBtn.disabled = false;
            addMessage('system', 'WebSocket connected', 'system');
        };

        ws.onmessage = (event) => {
            try {
                addMessage('incoming', JSON.parse(event.data));
            } catch (e) {
                addMessage('incoming', event.data);
            }
        };

        ws.onerror = (error) => {
            addMessage('error', 'WebSocket error occurred', 'error');
        };

        ws.onclose = (event) => {
            updateStatus('disconnected', `Disconnected (${event.code})`);
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            sendBtn.disabled = true;
            ws = null;

            let reason = event.reason || 'Connection closed';
            addMessage('system', `WebSocket closed: ${reason}`, 'system');
        };
    });

    // Disconnect
    disconnectBtn.addEventListener('click', () => {
        if (ws) {
            ws.close();
        }
    });

    // Send ping
    sendBtn.addEventListener('click', () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            addMessage('error', 'WebSocket is not connected', 'error');
            return;
        }
        ws.send('ping');
        addMessage('outgoing', 'ping', 'ping');
    });
</script>
</body>
</html>
