[pytest]
# 출력·빌드 산출물 디렉토리는 테스트 수집에서 제외
# (test-results 안의 저장소 사본/리포트가 conftest 경로 충돌을 일으킴)
norecursedirs = .* build dist node_modules .venv venv site test-results
markers =
    e2e: End-to-end 테스트 마커
    integration: 통합 테스트 마커
    ratelimit: 레이트 리밋 테스트 마커
env_files =
    .env
filterwarnings =
    ignore:The 'lia' package has been renamed:DeprecationWarning:strawberry.fastapi.router
    ignore:Using both 'count' and 'until':DeprecationWarning:dateutil.rrule

