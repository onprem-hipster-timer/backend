# 로컬 개발용. infra/modules/kratos-config/templates/kratos.yml.tftpl을 로컬 값으로 옮긴 것이다.
# infra 템플릿이 바뀌면 함께 맞춘다. secrets는 개발 전용 고정값이다.
# infra와 다른 점은 맨 아래 feature_flags 하나다.
version: v26.2.0

serve:
  public:
    base_url: http://localhost:2614/auth/
    host: 0.0.0.0
    port: 4433
    cors:
      enabled: false # CORS는 backend가 응답한다
  admin:
    base_url: http://127.0.0.1:4434/
    host: 127.0.0.1
    port: 4434

selfservice:
  default_browser_return_url: http://localhost:3100/
  allowed_return_urls:
    - http://localhost:3100
    - http://localhost:3100/

  methods:
    password:
      enabled: true
    code:
      enabled: true
    oidc:
      # dev/kratos/google.env가 있을 때만 켜진다. 그 파일이 클라이언트 ID와 secret도 환경 변수로
      # 넣는다(google.env.example). infra도 secret을 같은 이름의 환경 변수로 넣는다.
      enabled: false
      config:
        providers:
          - id: google
            provider: google
            client_id: set-by-env
            client_secret: set-by-env
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope: ["openid", "email", "profile"]

  flows:
    error:
      ui_url: http://localhost:3100/auth-error
    login:
      ui_url: http://localhost:3100/login
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: require_verified_address
    registration:
      enabled: true
      ui_url: http://localhost:3100/signup
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: show_verification_ui
        oidc:
          hooks:
            - hook: session
    settings:
      ui_url: http://localhost:3100/mypage
      privileged_session_max_age: 15m
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
    verification:
      enabled: true
      use: code
      ui_url: http://localhost:3100/verification
      after:
        default_browser_return_url: http://localhost:3100/
    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:3100/forgot-password
      lifespan: 15m
      after:
        hooks:
          - hook: revoke_active_sessions
    logout:
      after:
        default_browser_return_url: http://localhost:3100/login

session:
  lifespan: 720h
  earliest_possible_extend: 24h
  cookie:
    persistent: true
    same_site: Lax
  whoami:
    tokenizer:
      templates:
        api:
          ttl: 10m
          jwks_url: file:///etc/config/kratos/jwks.private.json
          claims_mapper_url: file:///etc/config/kratos/api-jwt.claims.jsonnet

cookies:
  same_site: Lax

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

ciphers:
  algorithm: xchacha20-poly1305

secrets:
  default:
    - dev-only-default-secret-0000001
  cookie:
    - dev-only-cookie-secret-00000001
  cipher:
    - dev-only-cipher-secret-32-chars!

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@example.com
    from_name: Hipster Timer

log:
  level: info
  format: text
  leak_sensitive_values: false

# API 플로우 복구가 세션 토큰과 설정 플로우를 continue_with로 돌려주게 한다.
# 끄면 복구 코드 제출이 422(browser_location_change_required)로 끝나서, 토큰으로 인증하는 앱은
# 새 비밀번호를 설정할 수 없다. infra 템플릿에도 같은 값이 필요하다.
feature_flags:
  use_continue_with_transitions: true
