name: Deploy to Cloud Run

# main에서 이미지 빌드가 성공하면 그 커밋의 이미지를 Cloud Run에 배포한다.
#
# - GCP 로그인은 Workload Identity Federation(키 없음). infra가 main의 이 파일
#   (.github/workflows/deploy.yml) 하나만 배포 계정을 쓰게 허용한다. 경로나 이름을 바꾸거나
#   다른 워크플로에서 uses:로 부르면 로그인이 거부된다.
# - 저장소 변수 GCP_PROJECT_ID, GCP_REGION, GCP_DEPLOY_WIF_PROVIDER, GCP_DEPLOYER_SA가 없으면
#   배포를 건너뛴다. 값과 배포 계정의 권한 범위는 infra README "CI 배포".
# - 되돌릴 때는 Actions에서 이 워크플로를 수동 실행하고 이전 버전 태그를 준다.

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 이미지 태그 (예: v2026.11.04-fcb420a)'
        required: true

# 배포가 겹치지 않게 하고, 마이그레이션 중간에 끊지 않는다
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      vars.GCP_DEPLOYER_SA != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # WIF 토큰. 없으면 인증 단계가 실패한다
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # 빌드가 끝나서 온 경우 그 커밋의 sha 태그, 수동 실행이면 입력한 태그
      SOURCE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || format('sha-{0}', github.event.workflow_run.head_sha) }}
    steps:
      # 태그 대신 digest로 고정한다. Artifact Registry 원격 저장소는 태그 조회를 최대 1시간
      # 캐시해서, 같은 태그로 다시 빌드한 이미지는 옛 것이 올 수 있다.
      - name: Resolve image digest
        id: image
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::잘못된 태그: $SOURCE_TAG"; exit 1; }
          repo="${GITHUB_REPOSITORY,,}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          digest=$(curl -fsSI \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${SOURCE_TAG}" \
            | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" {print $2}')
          [ -n "$digest" ] || { echo "::error::ghcr에 ${SOURCE_TAG} 이미지가 없음"; exit 1; }
          echo "ref=${REGION}-docker.pkg.dev/${CLOUDSDK_CORE_PROJECT}/ghcr/${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "${SOURCE_TAG} -> ${digest}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 순서를 지킨다. 새 스키마가 필요한 코드가 마이그레이션보다 먼저 뜨면, 앱 계정(app_rw)은
      # 테이블을 만들 권한이 없어 실패한다.
      - name: Migrate database
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          gcloud run jobs update app-migrate --region "$REGION" --image "$IMAGE" --quiet
          gcloud run jobs execute app-migrate --region "$REGION" --wait

      - name: Deploy api
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: gcloud run services update api --region "$REGION" --container api --image "$IMAGE" --quiet
